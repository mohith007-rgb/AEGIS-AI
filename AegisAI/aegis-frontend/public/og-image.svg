<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0c10"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Shield icon (centered upper) -->
  <g transform="translate(572, 148)">
    <!-- Shield body -->
    <path d="M28 0 L56 12 L56 32 C56 46 44 58 28 64 C12 58 0 46 0 32 L0 12 Z"
          fill="#1e2330" stroke="#3b82f6" stroke-width="2"/>
    <!-- Lock body -->
    <rect x="19" y="30" width="18" height="16" rx="2" fill="#3b82f6"/>
    <!-- Lock shackle -->
    <path d="M22 30 L22 24 C22 19.6 34 19.6 34 24 L34 30"
          fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="28" cy="37" r="2.5" fill="#0a0c10"/>
    <rect x="26.5" y="37" width="3" height="4" rx="1" fill="#0a0c10"/>
  </g>

  <!-- AEGIS-AI wordmark -->
  <text x="600" y="284"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1"
        text-anchor="middle" fill="#e8eaf0">AEGIS</text>
  <text x="760" y="284"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1"
        text-anchor="middle" fill="#3b82f6">-AI</text>

  <!-- Tagline -->
  <text x="600" y="336"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="400" letter-spacing="0.5"
        text-anchor="middle" fill="#6b7280">
    Cybersecurity Threat Scanner
  </text>

  <!-- Divider -->
  <line x1="440" y1="372" x2="760" y2="372" stroke="#1e2330" stroke-width="1"/>

  <!-- Sub-description -->
  <text x="600" y="408"
        font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="17" font-weight="400"
        text-anchor="middle" fill="#6b7280">
    OCR extraction · IBM Bob LLM · 5-tier risk scoring
  </text>

  <!-- Powered-by badge -->
  <rect x="490" y="445" width="220" height="38" rx="8"
        fill="#111318" stroke="#1e2330" stroke-width="1"/>
  <text x="600" y="469"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="13" font-weight="500"
        text-anchor="middle" fill="#3b82f6">
    Powered by IBM Bob
  </text>
</svg>
